<!-- Status indicador de conexão -->
<div id="realtime-status" class="mt-4 text-sm text-gray-500">
    <span id="connection-indicator" class="inline-block w-2 h-2 bg-gray-300 rounded-full mr-2"></span>
    Conectando ao dashboard em tempo real...
</div>

<script src="/assets/js/painel/realtime-dashboard.js"></script>

<script>
// Monitorar status de conexão
document.addEventListener('dashboardUpdate', () => {
    const indicator = document.getElementById('connection-indicator');
    indicator.className = 'inline-block w-2 h-2 bg-green-500 rounded-full mr-2';
    document.getElementById('realtime-status').textContent = 'Dashboard em tempo real (conectado)';
});

// Reconectar quando voltar do background
document.addEventListener('visibilitychange', () => {
    if (!document.hidden && window.realtimeDashboard) {
        const status = window.realtimeDashboard.getConnectionStatus();
        if (!status.connected) {
            document.getElementById('connection-indicator').className = 'inline-block w-2 h-2 bg-yellow-500 rounded-full mr-2';
            document.getElementById('realtime-status').textContent = 'Reconectando ao dashboard...';
        }
    }
});
</script>

<style>
.updated-value {
    animation: pulse 0.6s ease-in-out;
    background: linear-gradient(135deg, rgba(0, 123, 255, 0.1) 0%, transparent 100%);
    padding: 0.5rem;
    border-radius: 0.25rem;
}

@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
}

#realtime-status {
    display: flex;
    align-items: center;
    padding: 0.5rem 1rem;
    background: #f8f9fa;
    border-radius: 0.5rem;
}
</style>
